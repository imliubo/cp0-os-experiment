# Override the BSP's development-friendly 0666 modes. Only cp0-gpiod may
# operate the four logical connector outputs on production images.
z /sys/class/leds/grove_fun/brightness        0660 root cp0-gpio -
z /sys/class/leds/ext_usb_gpio_fun/brightness 0660 root cp0-gpio -
z /sys/class/leds/grove_5v_out/brightness     0660 root cp0-gpio -
z /sys/class/leds/ext_5v_out/brightness       0660 root cp0-gpio -
