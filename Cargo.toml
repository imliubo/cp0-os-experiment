[workspace]
members = [
    "crates/cp0-appd",
    "crates/cp0-audio-protocol",
    "crates/cp0-audiod",
    "crates/cp0-camera-protocol",
    "crates/cp0-camerad",
    "crates/cp0-document-protocol",
    "crates/cp0-documentd",
    "crates/cp0-gpio-protocol",
    "crates/cp0-gpiod",
    "crates/cp0-manifest",
    "crates/cp0-network-protocol",
    "crates/cp0-networkd",
    "crates/cp0-os-update",
    "crates/cp0-package",
    "crates/cp0-radio-protocol",
    "crates/cp0-radiod",
    "crates/cp0-recovery",
    "crates/cp0-storage-protocol",
    "crates/cp0-storaged",
    "crates/cp0-store-control",
    "crates/cp0-store-control-server",
    "crates/cp0-store-metadata",
    "crates/cp0-store-protocol",
    "crates/cp0-stored",
    "crates/cp0ctl",
    "sdk/rust",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
libc = "0.2.177"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
ed25519-dalek = "2.2.0"
sha2 = "0.10.9"
semver = "1.0.27"
axum = "=0.8.4"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "migrate", "macros"] }
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util"] }
tower = "=0.5.2"
uuid = { version = "=1.18.0", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
