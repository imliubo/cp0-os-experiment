name: app-devkit

on:
  workflow_dispatch:
  push:
    tags:
      - "app-sdk-v*"

permissions:
  contents: read

jobs:
  native-devkit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
          rustup override set 1.85.1
      - name: Verify relocatable DevKit
        run: ./tests/test-app-devkit.sh
      - name: Build release artifact
        run: ./scripts/package-app-devkit.sh target/app-devkit-release
      - name: Enforce public release licensing
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test -s LICENSE
          test -s THIRD_PARTY_NOTICES
      - uses: actions/upload-artifact@v4
        with:
          name: cardputerzero-app-devkit-${{ runner.os }}-${{ runner.arch }}
          path: target/app-devkit-release/*
          if-no-files-found: error
