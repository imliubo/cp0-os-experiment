name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            device-tree-compiler \
            file \
            jq \
            libdigest-sha-perl \
            libpng-dev \
            perl \
            pkg-config \
            python3 \
            ripgrep \
            xz-utils
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            developer-portal/package-lock.json
            review-console/package-lock.json
            store-operations/package-lock.json
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown --component clippy,rustfmt
          rustup override set 1.85.1
      - name: Install pinned Emscripten
        run: |
          emsdk_version=$(awk -F '"' '$1 ~ /^emscripten_version = / { print $2 }' \
            devkit/toolchain.toml)
          test -n "$emsdk_version"
          emsdk="$RUNNER_TEMP/emsdk"
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$emsdk"
          "$emsdk/emsdk" install "$emsdk_version"
          "$emsdk/emsdk" activate "$emsdk_version"
          echo "$emsdk/upstream/emscripten" >>"$GITHUB_PATH"
          "$emsdk/upstream/emscripten/emcc" --version | grep -F "$emsdk_version"
      - name: Verify acceptance toolchain
        run: |
          for command in \
            bash cargo cc dtc em++ emcc fdtget fdtput file git jq node npm perl pkg-config \
            python3 rg rustup shasum tar xz; do
            command -v "$command" >/dev/null
          done
          pkg-config --exists libpng
      - name: Install web dependencies
        run: |
          npm --prefix developer-portal ci
          npm --prefix review-console ci
          npm --prefix store-operations ci
      - name: Run repository acceptance checks
        run: make check
      - name: Run workspace Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D clippy::correctness
      - name: Verify web applications
        run: make portal-check review-console-check store-operations-check
      - name: Verify clean diff
        run: git diff --check
