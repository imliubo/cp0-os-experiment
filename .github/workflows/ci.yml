name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check JSON
        run: jq empty schemas/app-manifest-v1.schema.json examples/hello-card/app.json
      - name: Build and test
        run: cargo test --workspace --locked

