name: release-image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build and upload
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-image:
    # pi-gen executes an ARM64 userspace for every image stage. Use the
    # native public ARM runner so the release build does not depend on slow
    # host-level QEMU emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install release dependencies
        run: |
          host_arch=$(dpkg --print-architecture)
          case "$host_arch" in
            amd64)
              sudo dpkg --add-architecture arm64
              sudo find /etc/apt/sources.list.d -type f -name '*.sources' \
                -exec sed -i '/^Components:/a Architectures: amd64' {} +
              cat <<'EOF' | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse
          EOF
              ;;
            arm64) ;;
            *) echo "unsupported runner architecture: $host_arch" >&2; exit 1 ;;
          esac
          release_packages=(
            autoconf
            automake
            binutils-aarch64-linux-gnu
            build-essential
            cmake
            curl
            file
            g++-aarch64-linux-gnu
            gcc-aarch64-linux-gnu
            jq
            libcrypt-dev:arm64
            libexpat1-dev
            libtool
            pkg-config
            rsync
            xz-utils
          )
          if [[ $host_arch == amd64 ]]; then
            release_packages+=(binfmt-support qemu-user-static)
          fi
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y "${release_packages[@]}"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal \
            --target aarch64-unknown-linux-gnu \
            --target wasm32-unknown-unknown
          rustup override set 1.85.1
      - name: Verify image build toolchain
        run: |
          for command in \
            aarch64-linux-gnu-ar \
            aarch64-linux-gnu-g++ \
            aarch64-linux-gnu-gcc \
            aarch64-linux-gnu-ranlib \
            aarch64-linux-gnu-readelf \
            cmake docker file git make pkg-config rsync xz; do
            command -v "$command" >/dev/null
          done
          test -f /usr/lib/aarch64-linux-gnu/libcrypt.so
          printf 'int main(void) { return 0; }\n' \
            | aarch64-linux-gnu-gcc -x c - \
              -L/usr/lib/aarch64-linux-gnu -lcrypt \
              -o "$RUNNER_TEMP/aarch64-libcrypt-check"
          rustup target list --installed | grep -Fx aarch64-unknown-linux-gnu
          rustup target list --installed | grep -Fx wasm32-unknown-unknown
          pkg-config --exists expat
      - name: Register ARM64 binfmt
        run: |
          if [[ $(dpkg --print-architecture) == amd64 ]]; then
            sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc || true
            sudo update-binfmts --enable qemu-aarch64
            if [[ ! -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ]]; then
              sudo update-binfmts --display qemu-aarch64 || true
              echo "error: qemu-aarch64 binfmt registration is unavailable" >&2
              exit 1
            fi
          else
            test "$(dpkg --print-architecture)" = arm64
            test "$(uname -m)" = aarch64
            echo "native ARM64 runner; binfmt registration is unnecessary"
          fi
      - name: Check DevKit release licensing
        id: devkit_license
        run: |
          if [[ -s LICENSE && -s THIRD_PARTY_NOTICES ]]; then
            echo "public_assets=true" >>"$GITHUB_OUTPUT"
          else
            echo "public_assets=false" >>"$GITHUB_OUTPUT"
            echo "DevKit and Skill assets require LICENSE and THIRD_PARTY_NOTICES."
          fi
      - name: Verify Skill
        if: steps.devkit_license.outputs.public_assets == 'true'
        run: ./tests/test-app-skill.sh
      - name: Build App DevKit
        if: steps.devkit_license.outputs.public_assets == 'true'
        run: ./scripts/package-app-devkit.sh target/release-app-devkit
      - name: Package Skill
        if: steps.devkit_license.outputs.public_assets == 'true'
        run: |
          mkdir -p target/release-skill
          tar -C skills -cJf target/release-skill/cardputerzero-build-app.tar.xz \
            cardputerzero-build-app
          (
            cd target/release-skill
            shasum -a 256 cardputerzero-build-app.tar.xz \
              >cardputerzero-build-app.tar.xz.sha256
          )
      - name: Remove previous image outputs
        run: rm -f deploy/*.img.xz deploy/*.info deploy/SHA256SUMS deploy/build*.log
      - name: Build production image
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-L/usr/lib/aarch64-linux-gnu
          CP0_ACCESS_PROFILE: production
          CP0_IMAGE_NAME: cardputerzero-os-${{ github.event.release.tag_name || inputs.release_tag }}
        run: make image
      - name: Verify image
        run: make verify-image
      - name: Upload release image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name || inputs.release_tag }}" \
            deploy/*.img.xz deploy/*.info deploy/SHA256SUMS \
            --clobber
      - name: Upload App DevKit and Skill
        if: steps.devkit_license.outputs.public_assets == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name || inputs.release_tag }}" \
            target/release-app-devkit/* \
            target/release-skill/* \
            --clobber
